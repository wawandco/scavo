<div class="max-w-4xl mx-auto w-full">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Teams</h1>
    <a href="/admin/teams/new" class="inline-flex items-center px-4 py-2 bg-amber-600 text-white text-sm font-medium rounded-md hover:bg-amber-500">
      <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
      </svg>
      New Team
    </a>
  </div>

  <%= if (len(teams) == 0) { %>
    <div class="bg-white rounded-lg shadow p-12 text-center">
      <p class="text-gray-500 text-lg">No teams yet.</p>
      <a href="/admin/teams/new" class="mt-4 inline-block text-amber-600 font-medium hover:text-amber-500">Create your first team →</a>
    </div>
  <% } else { %>
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <%= for (team) in teams { %>
            <tr>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                <a href="/admin/teams/<%= team.ID %>" class="text-amber-600 hover:text-amber-900"><%= team.Name %></a>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500"><%= team.CreatedAt.Format("Jan 02, 2006") %></td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <a href="/admin/teams/<%= team.ID %>/edit" class="text-amber-600 hover:text-amber-900 mr-4">Edit</a>
                <form action="/admin/teams/<%= team.ID %>/delete" method="POST" class="inline" onsubmit="return confirm('Delete this team? Members will be unassigned.');">
                  <button type="submit" class="text-red-600 hover:text-red-900">Delete</button>
                </form>
              </td>
            </tr>
          <% } %>
        </tbody>
      </table>
    </div>
  <% } %>
</div>
