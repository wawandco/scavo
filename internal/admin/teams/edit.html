<div class="max-w-4xl mx-auto w-full">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Team</h1>

  <form action="/admin/teams/<%= team.ID %>" method="POST" class="bg-white rounded-lg shadow p-6 space-y-6">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-900">Team Name</label>
      <input type="text" name="name" id="name" value="<%= team.Name %>" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-amber-500 focus:ring-amber-500 sm:text-sm px-3 py-2 border">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-900 mb-2">Members</label>
      <div class="space-y-2 max-h-64 overflow-y-auto border border-gray-300 rounded-md p-3">
        <%= for (member) in members { %>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" name="member_ids" value="<%= member.ID %>" <%= if (member.TeamID.Valid && member.TeamID.Int64 == teamID) { %>checked<% } %> class="rounded border-gray-300 text-amber-600 focus:ring-amber-500">
            <span class="text-sm text-gray-900"><%= member.Name %></span>
            <span class="text-xs text-gray-500 font-mono"><%= member.PersonalID %></span>
          </label>
        <% } %>
      </div>
    </div>

    <div class="flex items-center justify-between pt-4">
      <a href="/admin/teams/<%= team.ID %>" class="text-sm text-gray-600 hover:text-gray-900">Cancel</a>
      <button type="submit" class="inline-flex items-center px-4 py-2 bg-amber-600 text-white text-sm font-medium rounded-md hover:bg-amber-500">
        Update Team
      </button>
    </div>
  </form>
</div>
