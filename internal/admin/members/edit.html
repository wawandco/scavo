<div class="max-w-4xl mx-auto w-full">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">Edit Member</h1>

  <form action="/admin/members/<%= member.ID %>" method="POST" class="bg-white rounded-lg shadow p-6 space-y-6">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-900">Name</label>
      <input type="text" name="name" id="name" value="<%= member.Name %>" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm px-3 py-2 border">
    </div>

    <div>
      <label for="personal_id" class="block text-sm font-medium text-gray-900">Personal ID</label>
      <input type="text" name="personal_id" id="personal_id" value="<%= member.PersonalID %>" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm px-3 py-2 border">
      <p class="mt-1 text-sm text-gray-500">Unique ID used by the member to log in.</p>
    </div>

    <div>
      <label for="team_id" class="block text-sm font-medium text-gray-900">Team</label>
      <select name="team_id" id="team_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm px-3 py-2 border bg-white">
        <option value="">— No team —</option>
        <%= for (team) in teams { %>
          <option value="<%= team.ID %>" <%= if (member.TeamID.Valid && member.TeamID.Int64 == team.ID) { %>selected<% } %>><%= team.Name %></option>
        <% } %>
      </select>
    </div>

    <div class="flex items-center gap-2">
      <input type="checkbox" name="is_admin" id="is_admin" value="1" <%= if (member.IsAdmin) { %>checked<% } %> class="rounded border-gray-300 text-emerald-600 focus:ring-emerald-500">
      <label for="is_admin" class="text-sm font-medium text-gray-900">Admin</label>
    </div>

    <div class="flex items-center justify-between pt-4">
      <a href="/admin/members/<%= member.ID %>" class="text-sm text-gray-600 hover:text-gray-900">Cancel</a>
      <button type="submit" class="inline-flex items-center px-4 py-2 bg-emerald-600 text-white text-sm font-medium rounded-md hover:bg-emerald-500">
        Update Member
      </button>
    </div>
  </form>
</div>
