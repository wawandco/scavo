<div class="max-w-4xl mx-auto w-full">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">New Hunt</h1>

  <form action="/admin/hunts" method="POST" class="bg-white rounded-lg shadow p-6 space-y-6">
    <div>
      <label for="title" class="block text-sm font-medium text-gray-900">Title</label>
      <input type="text" name="title" id="title" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border">
    </div>

    <div>
      <label for="description" class="block text-sm font-medium text-gray-900">Description</label>
      <textarea name="description" id="description" rows="6" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border"></textarea>
      <p class="mt-1 text-sm text-gray-500">Describe the task teams need to complete.</p>
    </div>

    <div>
      <label for="points" class="block text-sm font-medium text-gray-900">Points</label>
      <input type="number" name="points" id="points" value="10" min="1" required class="mt-1 block w-32 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm px-3 py-2 border">
    </div>

    <div class="flex items-center justify-between pt-4">
      <a href="/admin/hunts" class="text-sm text-gray-600 hover:text-gray-900">Cancel</a>
      <button type="submit" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-md hover:bg-indigo-500">
        Create Hunt
      </button>
    </div>
  </form>
</div>
